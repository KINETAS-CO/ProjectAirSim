[package]
name = "projectairsim"
version = "0.1.0"
edition = "2021"
description = "Native Rust client for ProjectAirSim simulation server"
license = "MIT"

[features]
default = ["async"]
async = ["dep:tokio", "dep:futures-util", "dep:async-trait"]
sync = ["dep:crossbeam-channel"]
full = ["async", "sync"]

[dependencies]
# Transport (nng-rs)
nng = "1.0"

# Wire protocol & Serialization (always included)
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
byteorder = "1.5"
thiserror = "1.0"
tracing = "0.1"

# Async dependencies (default)
tokio = { version = "1.36", features = ["rt", "sync", "time", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }

# Sync dependencies (optional)
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
tracing-subscriber = "0.3"
tempfile = "3.10"
rmpv = { version = "1.3", features = ["with-serde"] }
